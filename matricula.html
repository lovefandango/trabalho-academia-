<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula</title>
    <link rel="stylesheet" href="matricula.css">
</head>

<body>

    <main class="matricula">
        <div class="logo-area">
            <img src="assets/logo-academia.png" alt="Logo da S.L Academy" class="logo-badge">
            <span class="logo-text"><strong>S.L Academy</strong></span>

        </div>

        <header class="matricula-header">
            <h1>Faça sua matrícula</h1>
            <p>Preencha seus dados e escolha seu plano.</p>
        </header>

        <form class="matricula-form">

            <section class="form-section">
                <div class="section-title">
                    <span>01</span>
                    <div>
                        <h2>Dados pessoais</h2>
                        <p>Informe seus dados.</p>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Seu nome">
                    </div>

                    <div class="form-group">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" placeholder="Seu sobrenome">
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00">
                    </div>

                    <div class="form-group">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <div class="section-title">
                    <span>02</span>
                    <div>
                        <h2>Escolha seu plano</h2>
                        <p>Selecione uma opção.</p>
                    </div>
                </div>

                <div class="plan-options">

                    <label class="plan-card">
                        <input type="radio" name="plano" value="bronze">
                        <div class="card-content">
                            <h3>Bronze</h3>
                            <p>Plano Bronze</p>
                        </div>
                    </label>

                    <label class="plan-card">
                        <input type="radio" name="plano" value="prata">
                        <div class="card-content">
                            <h3>Prata</h3>
                            <p>Plano Prata</p>
                        </div>
                    </label>

                    <label class="plan-card">
                        <input type="radio" name="plano" value="ouro">
                        <div class="card-content">
                            <h3>Ouro</h3>
                            <p>Plano Ouro</p>
                        </div>
                    </label>

                </div>
            </section>

            <section class="form-section">
                <div class="section-title">
                    <span>03</span>
                    <div>
                        <h2>Forma de pagamento</h2>
                        <p>Escolha como pretende pagar.</p>
                    </div>
                </div>

                <div class="payment-options">

                    <label class="payment-card">
                        <input type="radio" name="pagamento" value="pix">
                        <div class="card-content">
                            <h3>PIX</h3>
                            <p>Pagamento via PIX</p>
                        </div>
                    </label>

                    <label class="payment-card">
                        <input type="radio" name="pagamento" value="cartao">
                        <div class="card-content">
                            <h3>Cartão</h3>
                            <p>Pagamento via cartão</p>
                        </div>
                    </label>

                </div>
            </section>

            <div class="form-actions">
                <button type="button" class="btn-matricula">
                    Finalizar matrícula
                </button>
            </div>

        </form>

    </main>

</body>
</html>
